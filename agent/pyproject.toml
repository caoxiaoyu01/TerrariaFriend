[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "upmaplus" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "graphiti-core[falkordb,google-genai]>=0.29.3",
    "langchain-core>=1.6.0",
